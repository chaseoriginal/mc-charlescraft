services:
  minecraft:
    image: ${IMAGE}
    stdin_open: true
    tty: true
    ports:
    - ${IPADDRESS}:${UDPPORT}:${UDPPORT}/${PROTOU}
    - ${IPADDRESS}:${TCPPORTJ}:${TCPPORTJ}/${PROTOT}
    - ${IPADDRESS}:${TCPPORTM}:${TCPPORTM}/${PROTOT}
    environment:
      MOTD: Bedrock and Java Minecraft, survival multiplayer
      LEVEL_NAME: mc-charlescraft
      EULA: 'TRUE'
      ENABLE_RCON: 'true'
      RCON_PASSWORD: ${RCON_PASSWORD}
      RCON_PORT: ''
    volumes:
    - /var/lib/docker/volumes/mc-charlescraft:/minecraft
    restart: unless-stopped
volumes: {}
